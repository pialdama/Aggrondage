
name: Mise à jour des sondages

on:
  schedule:
    - cron: "0 6 * * *"   # lundi 06:00 UTC = 07h00/08h00 à Paris selon la saison
  workflow_dispatch:        # permet aussi de lancer à la main

permissions:
  contents: write           # autorise le workflow à commiter data.json

jobs:
  maj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Téléchargement et agrégation
        run: python sondages_2027.py

      - name: Commit de data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet && echo "Aucun changement" || git commit -m "Mise à jour des sondages"
          git push
